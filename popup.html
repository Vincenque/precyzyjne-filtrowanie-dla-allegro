<!DOCTYPE html>
<html lang="pl">
<head>
    <!-- Treści są generowane przez AI na podstawie promptów Vincenque (https://github.com/Vincenque) -->
    <meta charset="UTF-8">
    <style>
        body {
            width: 240px;
            padding: 16px;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            color: #222222;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .title {
            font-size: 14px;
            font-weight: bold;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cccccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #ff5a00;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
        /* Color legend section under the main switch */
        .legend {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid #e5e5e5;
            font-size: 12px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #444444;
        }
        /* Single legend row aligning color swatch with label */
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .color-sponsored {
            background-color: #cce8ff;
            border: 1px solid #99d1ff;
        }
        .color-promoted {
            background-color: #fffbe6;
            border: 1px solid #e6d899;
        }
        /* Footer section displaying the GitHub repository link and authorship note */
        .footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #e5e5e5;
            font-size: 11px;
            color: #666666;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .repo-link {
            color: #ff5a00;
            text-decoration: none;
            font-weight: bold;
        }
        .repo-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="title">Precyzyjne Filtrowanie</span>
        <label class="switch">
            <input type="checkbox" id="toggle-extension">
            <span class="slider"></span>
        </label>
    </div>
    <!-- Background highlight legend for Allegro offers -->
    <div class="legend">
        <div class="legend-title">Legenda kolorów tła:</div>
        <div class="legend-item">
            <span class="legend-color color-sponsored"></span>
            <span>Oferta sponsorowana</span>
        </div>
        <div class="legend-item">
            <span class="legend-color color-promoted"></span>
            <span>Oferta promowana</span>
        </div>
    </div>
    <!-- Repository link and transparent AI authorship note -->
    <div class="footer">
        <a class="repo-link" href="https://github.com/Vincenque/precyzyjne-filtrowanie-dla-allegro" target="_blank" rel="noopener noreferrer">Kod źródłowy na GitHub</a>
        <span>Główny twórca kodu: AI • prompty: Vincenque</span>
    </div>
    <script src="popup.js"></script>
</body>
</html>
